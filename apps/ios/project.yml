name: JotIOS
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: TRA7965NM5
    CODE_SIGN_STYLE: Automatic
targets:
  JotIOS:
    type: application
    platform: iOS
    sources:
      - JotIOS
      - path: ../../Sources/Jot/Core
      - path: ../../Sources/Jot/UI/LocalResourceSchemeHandler.swift
      - path: ../../Web/dist
        type: folder
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: JotIOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.erikjohansson.Jot.ios
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Info.plist
      properties:
        NSUbiquitousContainers:
          iCloud.com.erikjohansson.Jot:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Jot
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSMicrophoneUsageDescription: Jot uses your microphone for on-device dictation.
        NSSpeechRecognitionUsageDescription: Jot turns your speech into text on this device.
        CFBundleDisplayName: Jot
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  JotIOS:
    build:
      targets:
        JotIOS: all
